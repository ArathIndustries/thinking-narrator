<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thinking Narrator</title>
<style>
  :root {
    --bg: #0B0C0F; --surface: #13151A; --raise: #191C22; --edge: #23262E;
    --ink: #E6E2D8; --dim: #7C8090; --faint: #4A4E5A; --amber: #E8A33C;
    /* amber = thinking, sky = printed reply. One accent per block kind, so
       which one is speaking is legible without reading a word of it. */
    --sky: #7FB6D9; --sky-edge: #2E4652; --amber-edge: #4A4335;
    /* sage = tool call: present but recessive, since these are the most
       frequent blocks and should not shout over the reasoning. */
    --sage: #8FBF9F; --sage-edge: #2F4738;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; height: 100vh;
  }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; border-bottom: 1px solid var(--edge);
  }
  .lamp { width: 10px; height: 10px; border-radius: 50%;
          background: #2C2F37; flex: none; transition: background .3s; }
  .lamp.on { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
  .lamp.pulse { animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 14px var(--amber); } }
  @keyframes blink { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) {
    .lamp.pulse, .card.loading .rail, #gen .dot { animation: none !important; }
    * { scroll-behavior: auto !important; }
  }
  h1 { font: italic 600 17px Georgia, serif; letter-spacing: .02em; }
  #status { margin-left: auto; color: var(--dim); font-size: 12.5px;
            font-family: Consolas, monospace; text-align: right; }

  .body { display: grid; grid-template-columns: 250px 1fr; min-height: 0; }
  @media (max-width: 760px) { .body { grid-template-columns: 1fr; } aside { display: none; } }

  aside { border-right: 1px solid var(--edge); overflow-y: auto; padding: 8px; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
             color: var(--dim); padding: 6px 8px; }
  .sess { position: relative; width: 100%; text-align: left; background: none;
          border: 0; color: var(--ink); padding: 8px 64px 8px 10px;
          border-radius: 6px; cursor: pointer; font: inherit; display: block; }
  .sess:hover { background: var(--surface); }
  .sess.sel { background: var(--surface); box-shadow: inset 2px 0 0 var(--amber); }
  .sess .t { display: block; white-space: nowrap; overflow: hidden;
             text-overflow: ellipsis; }
  .sess .m { display: block; color: var(--dim); font-size: 11.5px;
             font-family: Consolas, monospace; }
  .sess .badge { position: absolute; right: 8px; top: 9px;
                 background: var(--amber); color: #14100A; border-radius: 9px;
                 font: 600 10.5px Consolas, monospace; padding: 2px 7px; }

  main { overflow-y: auto; padding: 16px 26px 30px; min-height: 0; }
  #empty { color: var(--dim); padding: 40px 0; text-align: center;
           font: italic 15px Georgia, serif; }
  .card { position: relative; background: var(--surface);
          border: 1px solid var(--edge); border-radius: 8px;
          padding: 12px 20px 12px 22px; margin: 0 0 12px; cursor: pointer; }
  .card .rail { position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
                border-radius: 8px 0 0 8px; background: var(--edge); }
  .card.playing .rail {
    background: linear-gradient(to bottom, var(--amber) var(--p, 0%), var(--edge) 0);
  }
  .card.loading .rail { background: var(--amber); animation: blink 1.1s infinite; }
  .card.loading .ts::after { content: " · synthesizing…"; color: var(--amber); }
  .card .ts { font: 11.5px Consolas, monospace; color: var(--dim); }
  .card .tx { font: 15.5px/1.65 Georgia, serif; margin-top: 5px;
              white-space: pre-wrap;
              display: -webkit-box; -webkit-line-clamp: 5;
              -webkit-box-orient: vertical; overflow: hidden; }
  .card.open .tx { display: block; }
  .card .more { background: none; border: 0; color: var(--dim); cursor: pointer;
                font: 11.5px Consolas, monospace; padding: 4px 0 0; }
  .card .more:hover { color: var(--ink); }
  .card.playing { border-color: var(--amber-edge); }

  .tx.karaoke { color: var(--faint); }
  .tx.karaoke .w.done { color: var(--ink); }
  .tx.karaoke .w.now { background: var(--amber); color: #14100A;
                       border-radius: 3px; padding: 0 2px; margin: 0 -2px; }

  /* ---- block kinds ---- */
  .card .kind { display: inline-block; font: 10.5px Consolas, monospace;
                text-transform: uppercase; letter-spacing: .08em;
                padding: 0 6px; margin-right: 9px; border-radius: 4px;
                border: 1px solid var(--amber-edge); color: var(--amber); }
  .card.k-text .kind { border-color: var(--sky-edge); color: var(--sky); }
  .card.k-text .tx { font-family: "Segoe UI", system-ui, sans-serif;
                     font-size: 14.5px; }
  .card.k-text.playing { border-color: var(--sky-edge); }
  .card.k-text.playing .rail {
    background: linear-gradient(to bottom, var(--sky) var(--p, 0%), var(--edge) 0);
  }
  .card.k-text.loading .rail { background: var(--sky); }
  .card.k-text .ts::after { color: var(--sky) !important; }
  .card.k-text .tx.karaoke .w.now { background: var(--sky); }

  .card.k-tool .kind { border-color: var(--sage-edge); color: var(--sage); }
  .card.k-tool { padding-top: 8px; padding-bottom: 8px; }
  .card.k-tool .tx { font: 13.5px/1.5 Consolas, monospace; color: var(--sage);
                     -webkit-line-clamp: 2; margin-top: 3px; }
  .card.k-tool.playing { border-color: var(--sage-edge); }
  .card.k-tool.playing .rail {
    background: linear-gradient(to bottom, var(--sage) var(--p, 0%), var(--edge) 0);
  }
  .card.k-tool.loading .rail { background: var(--sage); }
  .card.k-tool .ts::after { color: var(--sage) !important; }
  .card.k-tool .tx.karaoke .w.now { background: var(--sage); }
  .card.k-tool .more { display: none; }   /* one line; nothing to expand */

  /* ---- read mode: independent per-kind toggles, so every combination of
         thoughts / replies / tools is reachable ---- */
  #log .card { display: none; }
  #log.k-thinking .card.k-thinking,
  #log.k-text .card.k-text,
  #log.k-tool .card.k-tool { display: block; }

  #gen { display: none; color: var(--dim); font: italic 13.5px Georgia, serif;
         padding: 2px 4px 10px; }
  #gen .dot { color: var(--amber); animation: blink 1.2s infinite; }

  #jump { position: fixed; right: 26px; bottom: 88px; display: none;
          background: var(--raise); color: var(--amber);
          border: 1px solid var(--amber); border-radius: 16px;
          padding: 7px 14px; cursor: pointer; font: 12.5px Consolas, monospace;
          box-shadow: 0 2px 12px rgba(0,0,0,.5); }
  #jump:hover { background: var(--amber); color: #14100A; }

  footer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
           padding: 10px 16px; border-top: 1px solid var(--edge);
           background: var(--surface); }
  footer .btn { background: var(--raise); color: var(--ink);
                border: 1px solid var(--edge); border-radius: 6px;
                padding: 6px 11px; cursor: pointer; font: 13px Consolas, monospace; }
  footer .btn:hover { border-color: var(--amber); }
  #pp { width: 44px; font-size: 14px; }
  #time { font: 12px Consolas, monospace; color: var(--dim);
          min-width: 86px; text-align: center; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 4px;
                      background: var(--edge); border-radius: 2px; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: var(--amber); border: 0; }
  #seek { flex: 1 1 180px; min-width: 140px; }
  .vol { display: flex; align-items: center; gap: 6px; color: var(--dim);
         font-size: 12px; }
  #vol { width: 80px; }
  select { background: var(--raise); color: var(--ink);
           border: 1px solid var(--edge); border-radius: 6px;
           padding: 6px 8px; font: inherit; }
  select option { background: var(--raise); color: var(--ink); }
  .segs { display: flex; border: 1px solid var(--edge); border-radius: 6px;
          overflow: hidden; }
  .segs button { background: var(--raise); color: var(--dim); border: 0;
                 padding: 6px 9px; cursor: pointer; font: 12px Consolas, monospace; }
  .segs button + button { border-left: 1px solid var(--edge); }
  .segs button.act { background: var(--amber); color: #14100A; }
  label.tog { display: flex; align-items: center; gap: 6px; color: var(--dim);
              cursor: pointer; user-select: none; }
  label.tog input { accent-color: var(--amber); }
  .lbl { color: var(--dim); font-size: 12px; }
  #sessSel { display: none; max-width: 230px; font-size: 12.5px; }

  /* ---- panel: compact sidecar for docking beside a terminal ---- */
  body.panel aside { display: none; }
  body.panel .body { grid-template-columns: 1fr; }
  body.panel h1 { display: none; }
  body.panel #sessSel { display: block; }
  body.panel header { padding: 7px 10px; gap: 9px; }
  body.panel #status { font-size: 11px; }
  body.panel main { padding: 10px 12px 20px; }
  body.panel .card { padding: 9px 13px 9px 16px; margin-bottom: 9px; }
  body.panel .card .tx { font-size: 14px; line-height: 1.55; -webkit-line-clamp: 4; }
  body.panel .card.k-text .tx { font-size: 13.5px; }
  body.panel footer { padding: 7px 9px; gap: 5px 8px; }
  body.panel footer .btn { padding: 5px 9px; }
  body.panel .lbl, body.panel #time { font-size: 11px; }
  body.panel #jump { right: 14px; bottom: 108px; }

  :focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
</style>
</head>
<body>
<header>
  <span class="lamp" id="lamp"></span>
  <h1>Thinking Narrator</h1>
  <select id="sessSel" title="Session (panel layout has no sidebar)"></select>
  <div id="status">starting…</div>
</header>

<div class="body">
  <aside>
    <h2>Sessions</h2>
    <div id="sessions"></div>
  </aside>
  <main id="main">
    <div id="empty">Nothing yet — send a message in any chat and it'll appear here.</div>
    <div id="log"></div>
    <div id="gen"><span class="dot">●</span> thinking…</div>
  </main>
</div>

<button id="jump" title="Scroll to the newest thought">↓ newest</button>

<footer>
  <button class="btn" id="prevB" title="Previous thought (k)">⏮</button>
  <button class="btn" id="pp" title="Play / pause (space)">▶</button>
  <button class="btn" id="back" title="Back 10 seconds (←)">−10s</button>
  <button class="btn" id="nextB" title="Next thought (j)">⏭</button>
  <span id="time">0:00 / 0:00</span>
  <input type="range" id="seek" min="0" max="1000" value="0">
  <span class="vol">vol <input type="range" id="vol" min="0" max="1" step="0.01" value="1" title="Volume (m mutes)"></span>
  <span class="segs" id="mode" title="What gets read aloud — toggle each independently">
    <button data-k="thinking">Thoughts</button><button data-k="text">Replies</button><button data-k="tool">Tools</button>
  </span>
  <span class="lbl">thought</span>
  <select id="voice" title="Voice for thinking blocks">
    <option value="en-US-ChristopherNeural">Christopher (US, calm)</option>
    <option value="en-US-EricNeural">Eric (US, mellow)</option>
    <option value="en-US-GuyNeural">Guy (US, upbeat)</option>
    <option value="en-US-AriaNeural">Aria (US, expressive)</option>
    <option value="en-US-JennyNeural">Jenny (US, warm)</option>
    <option value="en-US-MichelleNeural">Michelle (US, even)</option>
    <option value="en-GB-RyanNeural">Ryan (UK)</option>
    <option value="en-GB-SoniaNeural">Sonia (UK)</option>
  </select>
  <span class="lbl">tool</span>
  <select id="voiceT" title="Voice for tool calls">
    <option value="en-US-ChristopherNeural">Christopher (US, calm)</option>
    <option value="en-US-EricNeural">Eric (US, mellow)</option>
    <option value="en-US-GuyNeural" selected>Guy (US, upbeat)</option>
    <option value="en-US-AriaNeural">Aria (US, expressive)</option>
    <option value="en-US-JennyNeural">Jenny (US, warm)</option>
    <option value="en-US-MichelleNeural">Michelle (US, even)</option>
    <option value="en-GB-RyanNeural">Ryan (UK)</option>
    <option value="en-GB-SoniaNeural">Sonia (UK)</option>
  </select>
  <span class="lbl">reply</span>
  <select id="voiceR" title="Voice for printed replies — pick a different one and you can tell them apart by ear">
    <option value="en-US-ChristopherNeural">Christopher (US, calm)</option>
    <option value="en-US-EricNeural">Eric (US, mellow)</option>
    <option value="en-US-GuyNeural">Guy (US, upbeat)</option>
    <option value="en-US-AriaNeural" selected>Aria (US, expressive)</option>
    <option value="en-US-JennyNeural">Jenny (US, warm)</option>
    <option value="en-US-MichelleNeural">Michelle (US, even)</option>
    <option value="en-GB-RyanNeural">Ryan (UK)</option>
    <option value="en-GB-SoniaNeural">Sonia (UK)</option>
  </select>
  <span class="segs" id="speed" title="Speed">
    <button data-r="0.75">.75×</button><button data-r="1" class="act">1×</button><button data-r="1.25">1.25×</button><button data-r="1.5">1.5×</button><button data-r="2">2×</button>
  </span>
  <label class="tog" title="After a thought ends, keep playing the next one"><input type="checkbox" id="through"> Play through</label>
  <label class="tog"><input type="checkbox" id="follow" checked> Follow active chat</label>
  <label class="tog"><input type="checkbox" id="autoplay" checked> Auto-read new</label>
</footer>

<script>
const $ = id => document.getElementById(id);
const audio = new Audio(), lamp = $("lamp"), statusEl = $("status"), main = $("main");

const S = {};                 // sid -> {blocks, el, scroll, everLoaded}
let sessions = [], selId = null;
let playing = { sid: null, idx: null };
let queue = [];               // [{sid, idx}]
let pendingKey = null, playToken = 0, inflight = false, seeking = false;
let k = { sid: null, idx: null, spans: [], times: [], at: -1, lineTop: -1 };

const j = async url => {
  const r = await fetch(url);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
};
const setStatus = t => statusEl.textContent = t;
const fmt = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}` : "0:00";

/* Transcript timestamps are UTC ISO ("2026-08-12T15:05:54.479Z"). Slicing
   characters out of that string shows UTC — five hours ahead here. Parse and
   render local instead. Blocks from an earlier day carry the date, because a
   session that runs past midnight otherwise shows two days as one. */
const p2 = n => String(n).padStart(2, "0");
function clock(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  if (isNaN(d)) return "—";
  const hms = `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
  const now = new Date();
  const sameDay = d.getFullYear() === now.getFullYear()
               && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
  return sameDay ? hms : `${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${hms}`;
}
const cardEl = (sid, idx) => $(`blk-${sid}-${idx}`);
const titleOf = sid => sessions.find(s => s.id === sid)?.title || "Thinking Narrator";

/* ---------- tab title + favicon ---------- */
const favLink = document.createElement("link");
favLink.rel = "icon";
document.head.appendChild(favLink);
const fav = c => "data:image/svg+xml," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="${c}"/></svg>`);
const FAV_ON = fav("#E8A33C"), FAV_OFF = fav("#4A4E5A");
function updateChrome() {
  const t = titleOf(playing.sid ?? selId);
  document.title = (audio.paused ? "" : "▶ ") + t;
  favLink.href = audio.paused ? FAV_OFF : FAV_ON;
}
updateChrome();

/* ---------- settings persistence ---------- */
const saved = JSON.parse(localStorage.getItem("tn-prefs") || "{}");
if (saved.voice) $("voice").value = saved.voice;
if (saved.voiceR) $("voiceR").value = saved.voiceR;
if (saved.voiceT) $("voiceT").value = saved.voiceT;
if (saved.vol !== undefined) $("vol").value = saved.vol;
if (saved.follow !== undefined) $("follow").checked = saved.follow;
if (saved.autoplay !== undefined) $("autoplay").checked = saved.autoplay;
if (saved.through !== undefined) $("through").checked = saved.through;
let rate = saved.rate || 1;
const ALL_KINDS = ["thinking", "text", "tool"];
/* Migrate the v9.0 single-mode string: "both" was the default, and tools are
   new, so an existing user lands on everything on rather than silently
   missing the feature they upgraded for. */
let kinds = Array.isArray(saved.kinds) ? saved.kinds.filter(k => ALL_KINDS.includes(k))
          : saved.mode === "thinking" ? ["thinking"]
          : saved.mode === "text" ? ["text"]
          : ALL_KINDS.slice();
if (!kinds.length) kinds = ALL_KINDS.slice();
audio.volume = parseFloat($("vol").value);
function savePrefs() {
  localStorage.setItem("tn-prefs", JSON.stringify({
    voice: $("voice").value, voiceR: $("voiceR").value, voiceT: $("voiceT").value,
    vol: audio.volume, rate, kinds,
    follow: $("follow").checked, autoplay: $("autoplay").checked,
    through: $("through").checked,
  }));
}

/* ---------- read mode ---------- */
const kindOK = kind => kinds.includes(kind);
const VOICE_SEL = { text: "voiceR", tool: "voiceT" };
const voiceFor = kind => $(VOICE_SEL[kind] || "voice").value;
const NOUN = { text: "reply", tool: "tool call" };
const nounOf = kind => NOUN[kind] || "thought";
/* First block at or after `from` in direction `dir` that the current mode
   plays — every transport control walks the list through this, so hidden
   kinds are skipped rather than played into a hidden card. */
function step(sid, from, dir) {
  const st = S[sid];
  if (!st) return -1;
  for (let i = from; i >= 0 && i < st.blocks.length; i += dir)
    if (kindOK(st.blocks[i].kind)) return i;
  return -1;
}
const newestVisible = sid => step(sid, (S[sid]?.blocks.length ?? 0) - 1, -1);
/* "nothing here" is a question about the current mode, not the raw count:
   a thoughts-only session in Replies mode is empty from where you sit. */
function updateEmpty() {
  $("empty").style.display = selId && newestVisible(selId) >= 0 ? "none" : "";
}
function applyMode() {
  $("log").className = kinds.map(k => "k-" + k).join(" ");
  document.querySelectorAll("#mode button")
    .forEach(b => b.classList.toggle("act", kindOK(b.dataset.k)));
  queue = queue.filter(q => kindOK(S[q.sid]?.blocks[q.idx]?.kind));
  updateEmpty();
  updateJump();
}
$("mode").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  const k = b.dataset.k;
  if (kindOK(k)) {
    if (kinds.length === 1) return;      // never leave nothing selected
    kinds = kinds.filter(x => x !== k);
  } else {
    kinds = ALL_KINDS.filter(x => x === k || kindOK(x));   // keep canonical order
  }
  applyMode();
  savePrefs();
};

applyMode();

/* panel layout: compact, sidebar hidden — for docking beside a terminal */
if (new URLSearchParams(location.search).get("panel") === "1")
  document.body.classList.add("panel");
const seen = JSON.parse(localStorage.getItem("tn-seen") || "{}");
const saveSeen = () => localStorage.setItem("tn-seen", JSON.stringify(seen));

/* ---------- sessions ---------- */
function ensure(sid) {
  if (!S[sid]) {
    const el = document.createElement("div");
    el.style.display = "none";
    $("log").appendChild(el);
    S[sid] = { blocks: [], el, scroll: null, everLoaded: false };
  }
  return S[sid];
}

function renderSessions() {
  const box = $("sessions"), sel = $("sessSel");
  box.innerHTML = "";
  sel.innerHTML = "";
  for (const s of sessions) {
    const o = document.createElement("option");
    o.value = s.id; o.textContent = s.title;
    if (s.id === selId) o.selected = true;
    sel.appendChild(o);
    const b = document.createElement("button");
    b.className = "sess" + (s.id === selId ? " sel" : "");
    const when = new Date(s.mtime * 1000).toLocaleString([], {month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"});
    b.innerHTML = `<span class="t"></span><span class="m"></span>`;
    b.querySelector(".t").textContent = s.title;
    b.querySelector(".m").textContent = `${when} · ${s.project}`;
    if (s.id !== selId && s.blocks != null) {
      const unread = s.blocks - (seen[s.id] ?? s.blocks);
      if (unread > 0) {
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = unread;
        b.appendChild(badge);
      }
    }
    b.onclick = () => { $("follow").checked = false; savePrefs(); select(s.id); };
    box.appendChild(b);
  }
}

function select(sid) {
  if (sid === selId) return;
  if (selId && S[selId]) S[selId].scroll = main.scrollTop;   // remember where you were
  selId = sid;
  const st = ensure(sid);
  for (const id in S) S[id].el.style.display = id === sid ? "" : "none";
  queue = queue.filter(q => q.sid === sid);                  // stale auto-play drops
  updateEmpty();
  main.scrollTop = st.scroll ?? main.scrollHeight;           // restore, or jump to newest
  renderSessions();
  updateChrome();
  updateJump();
}

/* ---------- thought log ---------- */
function addCard(sid, b) {
  const card = document.createElement("div");
  card.className = `card k-${b.kind}`; card.id = `blk-${sid}-${b.idx}`;
  card.innerHTML = `<div class="rail"></div><div class="ts"><span class="kind"></span><span class="when"></span></div><div class="tx"></div><button class="more">expand</button>`;
  card.querySelector(".kind").textContent = nounOf(b.kind);
  card.querySelector(".when").textContent = clock(b.ts);
  card.querySelector(".tx").textContent = b.text;
  card.querySelector(".more").onclick = e => {
    e.stopPropagation();
    card.classList.toggle("open");
    e.target.textContent = card.classList.contains("open") ? "collapse" : "expand";
  };
  card.onclick = () => {
    if (playing.sid === sid && playing.idx === b.idx && audio.src) {
      if (audio.paused) audio.play(); else audio.pause();   // click again = pause/resume
    } else {
      play(sid, b.idx);
    }
  };
  S[sid].el.appendChild(card);
}

/* ---------- karaoke ---------- */
function clearKaraoke() {
  if (k.sid === null) return;
  const old = cardEl(k.sid, k.idx);
  if (old && S[k.sid]) {
    const tx = old.querySelector(".tx");
    tx.classList.remove("karaoke");
    tx.textContent = S[k.sid].blocks[k.idx].text;
  }
  k = { sid: null, idx: null, spans: [], times: [], at: -1, lineTop: -1 };
}

function setupKaraoke(sid, idx, timings) {
  clearKaraoke();
  const card = cardEl(sid, idx), text = S[sid].blocks[idx].text;
  if (!card || !timings.length) { k.sid = sid; k.idx = idx; return; }
  const tx = card.querySelector(".tx");
  const frag = document.createDocumentFragment();
  const spans = [], times = [];
  let cur = 0, prev = null;
  for (const { t, w } of timings) {
    const i = text.indexOf(w, cur);
    if (i < 0) continue;                      // TTS normalized this token; skip
    const gap = text.slice(cur, i);
    if (gap) (prev || frag).appendChild(document.createTextNode(gap));
    const s = document.createElement("span");
    s.className = "w"; s.textContent = text.slice(i, i + w.length);
    frag.appendChild(s); spans.push(s); times.push(t);
    prev = s; cur = i + w.length;
  }
  const rest = text.slice(cur);
  if (rest) (prev || frag).appendChild(document.createTextNode(rest));
  tx.innerHTML = ""; tx.appendChild(frag); tx.classList.add("karaoke");
  card.classList.add("open");
  card.querySelector(".more").textContent = "collapse";
  k = { sid, idx, spans, times, at: -1, lineTop: -1 };
}

function karaokeStep() {
  if (k.times.length && !audio.paused) {
    const t = audio.currentTime;
    let lo = 0, hi = k.times.length - 1, i = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (k.times[mid] <= t) { i = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (i !== k.at) {
      if (i > k.at) {
        for (let n = Math.max(k.at, 0); n <= i; n++) k.spans[n].classList.add("done");
      } else {
        for (let n = i + 1; n <= k.at; n++) k.spans[n].classList.remove("done", "now");
      }
      if (k.at >= 0) k.spans[k.at].classList.remove("now");
      if (i >= 0) {
        const s = k.spans[i];
        s.classList.add("now");
        if (k.sid === selId && s.offsetTop !== k.lineTop) {
          k.lineTop = s.offsetTop;
          s.scrollIntoView({ block: "center", behavior: "smooth" });
        }
      }
      k.at = i;
    }
  }
  requestAnimationFrame(karaokeStep);
}
requestAnimationFrame(karaokeStep);

/* ---------- playback ---------- */
const prefetch = (sid, idx) => {  // start server-side synthesis now, discard result
  const b = S[sid]?.blocks[idx];
  if (!b) return;
  fetch(`/api/timings?session=${sid}&idx=${idx}&voice=${voiceFor(b.kind)}&rate=10`)
    .catch(() => {});
};

async function play(sid, idx) {
  const st = S[sid];
  if (!st || idx < 0 || idx >= st.blocks.length) return;
  const b = st.blocks[idx];
  const key = `${sid}:${idx}`;
  if (pendingKey === key) return;           // this block is already synthesizing
  const my = ++playToken;
  pendingKey = key;
  const card = cardEl(sid, idx);
  card?.classList.add("loading");
  setStatus(`synthesizing ${nounOf(b.kind)} ${idx + 1}…`);
  const qs = `session=${sid}&idx=${idx}&voice=${voiceFor(b.kind)}&rate=10`;
  let timings = [];
  try {
    timings = await j(`/api/timings?${qs}`);
  } catch (e) {
    setStatus(`synthesis failed — ${e.message}`);
    return;
  } finally {
    card?.classList.remove("loading");
    if (pendingKey === key) pendingKey = null;
  }
  if (my !== playToken) return;             // a newer click superseded this one
  playing = { sid, idx };
  document.querySelectorAll(".card.playing").forEach(c => c.classList.remove("playing"));
  card?.classList.add("playing");
  setupKaraoke(sid, idx, timings);
  audio.src = `/api/audio?${qs}`;
  audio.playbackRate = rate;
  audio.play().catch(() => setStatus("click ▶ once to allow audio"));
  const label = `${nounOf(b.kind)} ${idx + 1} of ${st.blocks.length}`;
  setStatus(label);
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: label[0].toUpperCase() + label.slice(1),
      artist: titleOf(sid), album: "Thinking Narrator",
    });
  }
  const nxt = step(sid, idx + 1, 1);
  if (nxt >= 0) prefetch(sid, nxt);
}

function pump() {
  if ((audio.paused || audio.ended) && !pendingKey && queue.length) {
    const n = queue.shift();
    play(n.sid, n.idx);
  }
}

audio.onended = () => {
  lamp.classList.remove("on"); $("pp").textContent = "▶"; updateChrome();
  if ($("through").checked && playing.sid !== null) {
    const nxt = step(playing.sid, playing.idx + 1, 1);
    if (nxt >= 0) {
      queue = queue.filter(q => !(q.sid === playing.sid && q.idx <= nxt));
      play(playing.sid, nxt);
      return;
    }
  }
  pump();
};
audio.onplay = () => { lamp.classList.add("on"); $("pp").textContent = "⏸"; updateChrome(); };
audio.onpause = () => { lamp.classList.remove("on"); $("pp").textContent = "▶"; updateChrome(); };
audio.onerror = () => setStatus("audio failed — offline? edge-tts needs network");
audio.ontimeupdate = () => {
  if (!seeking && audio.duration) {
    $("seek").value = Math.round(audio.currentTime / audio.duration * 1000);
    $("time").textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
  }
  const card = playing.sid !== null ? cardEl(playing.sid, playing.idx) : null;
  if (card && audio.duration)
    card.querySelector(".rail").style.setProperty("--p", (audio.currentTime / audio.duration * 100) + "%");
};

const playNewest = () => {
  if (!selId) return;
  const i = newestVisible(selId);
  if (i >= 0) play(selId, i);
};
$("pp").onclick = () => {
  if (audio.paused) {
    if (audio.src) audio.play(); else playNewest();
  } else audio.pause();
};
$("back").onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 10); };
$("prevB").onclick = () => {
  if (playing.sid === null) return;
  const i = step(playing.sid, playing.idx - 1, -1);
  if (i >= 0) play(playing.sid, i);
};
$("nextB").onclick = () => {
  if (playing.sid === null) { playNewest(); return; }
  const i = step(playing.sid, playing.idx + 1, 1);
  if (i >= 0) play(playing.sid, i);
};
$("seek").onpointerdown = () => seeking = true;
$("seek").onpointerup = () => seeking = false;
$("seek").oninput = () => {
  if (audio.duration) audio.currentTime = $("seek").value / 1000 * audio.duration;
};
$("vol").oninput = () => { audio.volume = parseFloat($("vol").value); savePrefs(); };
$("voice").onchange = savePrefs;
$("voiceR").onchange = savePrefs;
$("voiceT").onchange = savePrefs;
$("sessSel").onchange = () => {
  $("follow").checked = false; savePrefs(); select($("sessSel").value);
};
$("speed").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  rate = parseFloat(b.dataset.r);
  audio.playbackRate = rate;
  document.querySelectorAll("#speed button").forEach(x => x.classList.toggle("act", x === b));
  savePrefs();
};
document.querySelectorAll("#speed button").forEach(b =>
  b.classList.toggle("act", parseFloat(b.dataset.r) === rate));
$("follow").onchange = () => { savePrefs(); if ($("follow").checked) tick(); };
$("autoplay").onchange = savePrefs;
$("through").onchange = savePrefs;

/* ---------- keyboard + media keys ---------- */
document.addEventListener("keydown", e => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName)) return;
  if (e.key === " ") { e.preventDefault(); $("pp").click(); }
  else if (e.key === "ArrowRight") audio.currentTime += 5;
  else if (e.key === "ArrowLeft") audio.currentTime = Math.max(0, audio.currentTime - 5);
  else if (e.key === "j") $("nextB").click();
  else if (e.key === "k") $("prevB").click();
  else if (e.key === "m") { audio.muted = !audio.muted; setStatus(audio.muted ? "muted" : "unmuted"); }
});
if ("mediaSession" in navigator) {
  const ms = navigator.mediaSession;
  ms.setActionHandler("play", () => audio.play());
  ms.setActionHandler("pause", () => audio.pause());
  ms.setActionHandler("previoustrack", () => $("prevB").click());
  ms.setActionHandler("nexttrack", () => $("nextB").click());
  ms.setActionHandler("seekbackward", () => audio.currentTime = Math.max(0, audio.currentTime - 10));
  ms.setActionHandler("seekforward", () => audio.currentTime += 10);
}

/* ---------- jump to newest ---------- */
function updateJump() {
  $("jump").style.display =
    main.scrollTop + main.clientHeight < main.scrollHeight - 200 ? "" : "none";
}
main.onscroll = updateJump;
$("jump").onclick = () => main.scrollTo({ top: main.scrollHeight, behavior: "smooth" });

/* ---------- polling ---------- */
/* Reload when the page itself changes on disk. Only while paused — a reload
   mid-thought would lose your place, and a shipped change is never urgent
   enough to interrupt listening. */
let build = null;
async function checkBuild() {
  try {
    const v = await j("/api/version");
    if (build === null) { build = v.build; return; }
    if (v.build !== build && audio.paused && !pendingKey) location.reload();
  } catch (e) { /* older server without /api/version */ }
}

async function tick() {
  if (inflight) return;
  inflight = true;
  try {
    checkBuild();
    sessions = await j("/api/sessions");
    if ($("follow").checked && sessions.length && sessions[0].id !== selId)
      select(sessions[0].id);
    if (selId) {
      const st = ensure(selId);
      const fresh = await j(`/api/blocks?session=${selId}&after=${st.blocks.length}`);
      if (fresh.length) {
        const firstLoad = !st.everLoaded;
        const pinned = main.scrollTop + main.clientHeight >= main.scrollHeight - 90;
        for (const b of fresh) { st.blocks.push(b); addCard(selId, b); }
        st.everLoaded = true;
        updateEmpty();
        if (firstLoad || pinned) main.scrollTop = main.scrollHeight;
        if ($("autoplay").checked) {
          const cur = sessions.find(s => s.id === selId);
          if (firstLoad) {
            const i = newestVisible(selId);
            if (cur && i >= 0 && Date.now() / 1000 - cur.mtime < 30) {
              queue.push({ sid: selId, idx: i });
              prefetch(selId, i);
            }
          } else {
            for (const b of fresh) {   // synthesize on arrival, not on turn-to-play
              if (!kindOK(b.kind)) continue;
              queue.push({ sid: selId, idx: b.idx });
              prefetch(selId, b.idx);
            }
          }
        }
        pump();
      }
      const cur = sessions.find(s => s.id === selId);
      if (cur && cur.blocks != null) { seen[selId] = cur.blocks; saveSeen(); }
      $("gen").style.display =
        cur && Date.now() / 1000 - cur.mtime < 8 ? "" : "none";
      if (cur && audio.paused && !queue.length && !pendingKey)
        setStatus(`${$("follow").checked ? "following" : "locked"}: ${cur.title}`);
    }
    renderSessions();
    updateJump();
    lamp.classList.toggle("pulse", $("follow").checked && $("autoplay").checked && audio.paused);
  } catch (e) {
    setStatus("server unreachable — is server.py running?");
  }
  inflight = false;
}
setInterval(tick, 1500);
tick();
</script>
</body>
</html>
